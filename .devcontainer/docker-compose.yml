# Merged on top of the root docker-compose.yml (postgres), so the
# project directory is the repo root and relative paths below start there.
services:
  app:
    build:
      context: .devcontainer
    command: sleep infinity
    # An init process as PID 1 reaps the background dev server's processes
    # when they exit; `sleep` doesn't, so they'd linger as zombies.
    init: true
    # Published by Docker so localhost works with any client (devcontainer
    # CLI, VS Code, JetBrains), not only editors that honor forwardPorts.
    # Loopback only, so nothing is exposed to the LAN.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/workspace:cached
      # Keep the container's node_modules apart from the host's: pnpm refuses
      # to reuse a node_modules tree that was linked from a different store.
      - node-modules-root:/workspace/node_modules
      - node-modules-web:/workspace/apps/web/node_modules
      - node-modules-api:/workspace/packages/api/node_modules
      - node-modules-eslint-config:/workspace/packages/eslint-config/node_modules
      - node-modules-typescript-config:/workspace/packages/typescript-config/node_modules
    environment:
      # pnpm hardlinks from the store into node_modules/.pnpm, which only works
      # on the same filesystem. Anywhere else, pnpm silently creates
      # /workspace/.pnpm-store in the bind-mounted repo instead.
      pnpm_config_store_dir: /workspace/node_modules/.pnpm-store
      # Real env vars win over apps/web/.env (Next.js and drizzle-kit both use
      # @next/env, which never overrides existing variables).
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/app
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    depends_on:
      - postgres

  # Postgres stays internal, so this can run alongside `docker compose up`
  # from the host.
  postgres:
    ports: !reset []

volumes:
  node-modules-root:
  node-modules-web:
  node-modules-api:
  node-modules-eslint-config:
  node-modules-typescript-config:
